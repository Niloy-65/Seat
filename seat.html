<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>   ?</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f1; --card:#ffffff; --ink:#14261c; --muted:#5b6b62;
  --green:#0f5c3a; --sun:#f2a516; --line:#d5ded7; --seat:#c9d6cd; --bus:#e8efe9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1712;--card:#16241c;--ink:#eaf2ec;--muted:#93a69a;--green:#3fbf82;--line:#264032;--seat:#2c4436;--bus:#1b2d23;}
}
:root[data-theme="dark"]{--bg:#0e1712;--card:#16241c;--ink:#eaf2ec;--muted:#93a69a;--green:#3fbf82;--line:#264032;--seat:#2c4436;--bus:#1b2d23;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.5}
main{max-width:480px;height:100%;margin:0 auto;padding:14px 14px 14px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:1.5rem;line-height:1.25;margin:0}
.theme{flex:none;font:inherit;font-size:.9rem;font-weight:600;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.theme:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sub{color:var(--muted);margin:0 0 20px}
.label{font-weight:600;margin:10px 0 6px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.route{font:inherit;font-weight:600;font-size:.95rem;line-height:1.3;text-align:center;padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.route[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}
.route:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.timebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=time]{font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.link{font:inherit;background:none;border:0;color:var(--green);text-decoration:underline;cursor:pointer;padding:6px}
.result{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;text-align:center}
.result .side{font-size:2.3rem;font-weight:700;line-height:1.1;color:var(--green);margin:0}
.result p{margin:2px 0;flex:none}
.why{color:var(--muted);font-size:.95rem}
.empty{color:var(--muted);margin:0}
svg{flex:1 1 0;min-height:0;width:100%;margin:6px auto;display:block}
</style>
</head>
<body>
<main>
  <header class="top"><h1>   ?</h1><button class="theme" id="theme" type="button" aria-label="/  "></button></header>

  <div class="label">.   ?</div>
  <div class="routes">
    <button class="route" data-route="cn" aria-pressed="false">  </button>
    <button class="route" data-route="nc" aria-pressed="false">  </button>
  </div>

  <div class="label">.   ?</div>
  <div class="timebox">
    <input type="time" id="time" aria-label=" ">
    <button class="link" id="now" type="button">  </button>
  </div>

  <section class="result" aria-live="polite" id="result">
    <p class="empty">    </p>
  </section>

</main>

<script>
(function(){
  var route=null;
  var timeEl=document.getElementById('time');
  var out=document.getElementById('result');
  var btns=document.querySelectorAll('.route');

  function setNow(){
    var d=new Date();
    timeEl.value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  function bus(side){
    var left=side==='left';
    var seats='';
    for(var r=0;r<6;r++){
      var y=64+r*26;
      [[38,'left'],[58,'left'],[96,'right'],[116,'right']].forEach(function(s){
        var on=(s[1]===side);
        seats+='<rect x="'+s[0]+'" y="'+y+'" width="16" height="18" rx="4" fill="'+(on?'var(--sun)':'var(--seat)')+'"/>';
      });
    }
    return '<svg viewBox="0 0 170 240" role="img" aria-label="   , '+(left?'':'')+'   ">'
      +'<rect x="24" y="8" width="122" height="224" rx="26" fill="var(--bus)" stroke="var(--green)" stroke-width="3"/>'
      +'<circle cx="46" cy="38" r="9" fill="none" stroke="var(--green)" stroke-width="3"/>'
      +'<text x="85" y="42" text-anchor="middle" font-size="12" fill="var(--muted)"></text>'
      +seats
      +'<text x="10" y="126" font-size="11" fill="var(--muted)" text-anchor="middle" transform="rotate(-90 10 126)"></text>'
      +'<text x="160" y="126" font-size="11" fill="var(--muted)" text-anchor="middle" transform="rotate(90 160 126)"></text>'
      +'</svg>';
  }

  function render(){
    if(!route){return;}
    var v=timeEl.value||'00:00';
    var p=v.split(':');
    var mins=parseInt(p[0],10)*60+parseInt(p[1],10);
    var morning=mins<660; // 11:00  
    var left=(route==='cn')?morning:!morning;
    var side=left?'left':'right';
    var name=route==='cn'?'  ':'  ';
    out.innerHTML='<p>'+name+'</p>'
      +'<p class="side">'+(left?' ':' ')+'</p>'
      +'<p></p>'
      +bus(side)
      +'<p class="why">'+(morning?'  ':'  ')+'       </p>';
  }

  btns.forEach(function(b){
    b.addEventListener('click',function(){
      route=b.getAttribute('data-route');
      btns.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
      render();
    });
  });
  timeEl.addEventListener('input',render);
  document.getElementById('now').addEventListener('click',function(){setNow();render();});
  setNow();

  var root=document.documentElement, tb=document.getElementById('theme');
  function isDark(){return root.getAttribute('data-theme')==='dark';}
  function label(){tb.textContent=isDark()?'  ':'  ';}
  
  try{
    var saved=localStorage.getItem('theme');
    root.setAttribute('data-theme',saved||'light');
  }catch(e){}

  tb.addEventListener('click',function(){
    var next=isDark()?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next);}catch(e){}
    label();
  });
  label();
})();
</script>
</body>
</html>
